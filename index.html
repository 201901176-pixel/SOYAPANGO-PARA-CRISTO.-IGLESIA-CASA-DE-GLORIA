<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Mensaje para Ti</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        img {
            max-width: 95%;
            max-height: 95vh;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            object-fit: contain;
        }
    </style>
</head>
<body>

    <img id="imagenEvangelio" src="" alt="Mensaje de Fe">

    <script>
        const misImagenes = [
            "CAMISAS MUJER.jpg",
            "FE - GIS ARTEYLETRASt.jpg",
            "Godisguide.jpg",
            "Jesus en mi barca.jpg",
            "descargar (1).jpg",
            "descargar (10).jpg",
            "descargar (2).jpg",
            "descargar (3).jpg",
            "descargar (4).jpg",
            "descargar (5).jpg"
        ];

        const indiceAleatorio = Math.floor(Math.random() * misImagenes.length);
        document.getElementById("imagenEvangelio").src = misImagenes[indiceAleatorio];
    </script>
</body>
</html>
